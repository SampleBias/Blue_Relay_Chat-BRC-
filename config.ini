[application]
# Application settings
name = blue-relay-chat
version = 0.1.0
debug = false
log_level = INFO

[storage]
# Database and storage settings
data_dir = ~/.local/share/bitchat
database_file = bitchat.db
max_message_history = 10000
auto_cleanup = true
cleanup_interval_hours = 24

[network]
# Network and transport settings
max_retries = 3
retry_delay_seconds = 5
connection_timeout_seconds = 30
keepalive_interval_seconds = 60

[bluetooth]
# Bluetooth LE Mesh settings
adapter_name = hci0
scan_interval_seconds = 10
advertisement_interval_seconds = 5
max_peers = 50
mesh_ttl = 7
discovery_timeout_seconds = 30
power_save_mode = true

[nostr]
# Nostr protocol settings
relays = wss://relay.damus.io,wss://nos.lol,wss://relay.snort.social
max_relay_connections = 5
subscription_limit = 10
event_batch_size = 50
connection_timeout_seconds = 15
reconnect_interval_seconds = 30

[security]
# Security settings
encryption_algorithm = ChaCha20-Poly1305
key_derivation_iterations = 100000
emergency_wipe_gpio = 18
emergency_wipe_confirmations = 3

[cli]
# Command-line interface settings
refresh_rate_ms = 100
max_display_lines = 1000
timestamp_format = %H:%M:%S
show_system_messages = true
auto_scroll = true

[location]
# Location-based channel settings
auto_detect_location = true
geohash_precision = 5
location_update_interval_minutes = 30

[performance]
# Performance and resource settings
max_cpu_usage_percent = 50
max_memory_mb = 100
message_queue_size = 1000
compression_enabled = true
compression_threshold_bytes = 100

[channels]
# Channel settings
default_channel = mesh #bluetooth
auto_join_local_channels = true
channel_history_limit = 500
max_channel_name_length = 64