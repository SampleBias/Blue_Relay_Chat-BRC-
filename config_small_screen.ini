[application]
# Application settings optimized for small screen GUI
name = blue-relay-chat
version = 0.1.0
debug = false
log_level = INFO

[storage]
# Database and storage settings for small screen
data_dir = ~/.local/share/blue-relay-chat
database_file = blue-relay-chat.db
max_message_history = 50
auto_cleanup = true
cleanup_interval_hours = 6

[network]
# Network settings optimized for small screen
max_retries = 2
retry_delay_seconds = 15
connection_timeout_seconds = 60
keepalive_interval_seconds = 120

[bluetooth]
# Bluetooth settings for small screen deployment
adapter_name = hci0
scan_interval_seconds = 30
advertisement_interval_seconds = 20
max_peers = 8
mesh_ttl = 4
discovery_timeout_seconds = 60
power_save_mode = true

[nostr]
# Nostr settings for small screen (minimal)
relays = wss://relay.damus.io
max_relay_connections = 1
subscription_limit = 3
event_batch_size = 10
connection_timeout_seconds = 45
reconnect_interval_seconds = 120

[security]
# Security settings for small screen
encryption_algorithm = ChaCha20-Poly1305
key_derivation_iterations = 50000
emergency_wipe_gpio = 18
emergency_wipe_confirmations = 2

[cli]
# CLI settings (not used for small screen GUI)
refresh_rate_ms = 200
max_display_lines = 50
timestamp_format = %H:%M
show_system_messages = true
auto_scroll = true

[gui]
# Small screen GUI specific settings
screen_width = 128
screen_height = 128
font_width = 6
font_height = 8
max_display_messages = 10
auto_refresh_interval_ms = 500
input_timeout_seconds = 30
scroll_speed_ms = 100
button_debounce_ms = 50
show_cursor = true
cursor_blink_interval_ms = 500

[input]
# Input settings for toggle/button interface
input_type = "gpio"
gpio_config = "default"
enable_touch_input = false
enable_button_input = true
navigation_repeat_delay_ms = 200
text_input_timeout_seconds = 60
auto_switch_to_nav_mode = true

[display]
# Display hardware settings
device_path = /dev/fb1
color_mode = monochrome
rotation = 0
backlight_level = 80
contrast_level = 70
auto_dim_timeout_seconds = 300
auto_off_timeout_seconds = 600

[performance]
# Performance settings for small screen
max_cpu_usage_percent = 70
max_memory_mb = 100
message_queue_size = 100
compression_enabled = true
compression_threshold_bytes = 300
gui_update_interval_ms = 100

[channels]
# Channel settings for small screen
default_channel = mesh #local
auto_join_local_channels = true
channel_history_limit = 20
max_channel_name_length = 32

[small_screen]
# Small screen specific optimizations
minimal_ui = true
hide_timestamps = false
abbreviate_usernames = true
compact_messages = true
show_status_indicators = true
scroll_indicator_style = arrows
battery_monitoring = true
signal_monitoring = true
auto_status_update_interval_seconds = 10