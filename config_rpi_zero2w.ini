[application]
# Application settings optimized for Raspberry Pi Zero 2 W
name = blue-relay-chat
version = 0.1.0
debug = false
log_level = INFO

[storage]
# Database and storage settings for Pi Zero 2 W
data_dir = ~/.local/share/blue-relay-chat
database_file = blue-relay-chat.db
max_message_history = 5000
auto_cleanup = true
cleanup_interval_hours = 12

[network]
# Network and transport settings optimized for Pi Zero 2 W
max_retries = 2
retry_delay_seconds = 10
connection_timeout_seconds = 45
keepalive_interval_seconds = 90

[bluetooth]
# Bluetooth LE Mesh settings optimized for Pi Zero 2 W (512MB RAM)
adapter_name = hci0
scan_interval_seconds = 15
advertisement_interval_seconds = 10
max_peers = 15
mesh_ttl = 5
discovery_timeout_seconds = 45
power_save_mode = true

[nostr]
# Nostr protocol settings optimized for Pi Zero 2 W
relays = wss://relay.damus.io,wss://nos.lol
max_relay_connections = 2
subscription_limit = 5
event_batch_size = 20
connection_timeout_seconds = 30
reconnect_interval_seconds = 60

[security]
# Security settings for Pi Zero 2 W
encryption_algorithm = ChaCha20-Poly1305
key_derivation_iterations = 75000
emergency_wipe_gpio = 18
emergency_wipe_confirmations = 3

[cli]
# Command-line interface settings optimized for Pi Zero 2 W
refresh_rate_ms = 150
max_display_lines = 500
timestamp_format = %H:%M:%S
show_system_messages = true
auto_scroll = true

[location]
# Location-based channel settings for Pi Zero 2 W
auto_detect_location = true
geohash_precision = 4
location_update_interval_minutes = 45

[performance]
# Performance and resource settings optimized for Pi Zero 2 W (512MB RAM)
max_cpu_usage_percent = 60
max_memory_mb = 150
message_queue_size = 300
compression_enabled = true
compression_threshold_bytes = 200

[channels]
# Channel settings for Pi Zero 2 W
default_channel = mesh #bluetooth
auto_join_local_channels = true
channel_history_limit = 200
max_channel_name_length = 64

[rpi_zero2w]
# Raspberry Pi Zero 2 W specific settings
hardware_model = "Raspberry Pi Zero 2 W"
cpu_cores = 4
total_memory_mb = 512
bluetooth_version = "5.0"
wifi_bands = "2.4GHz"
gpio_pins = 40
enable_swap = true
swap_size_mb = 1024
gpu_memory_mb = 16
disable_gui_on_boot = false
overclock_enabled = false
overclock_freq_mhz = 1000