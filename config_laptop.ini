# Blue Relay Chat - Laptop Client Configuration
# This file contains settings specific to the laptop client implementation

[application]
name = "blue-relay-chat"
version = "1.0.0"
debug = false
log_level = "INFO"
mode = "laptop"

[laptop_gui]
window_width = 600
window_height = 400
min_window_width = 400
min_window_height = 300
auto_scroll = true
max_message_history = 1000
font_family = "TkDefaultFont"
font_size = 10
theme = "light"
show_timestamps = true
compact_mode = false

[laptop_bluetooth]
adapter_name = "auto"
scan_interval_seconds = 30
max_peers = 20
auto_reconnect = true
connection_timeout_seconds = 10
discovery_timeout_seconds = 30
power_save_mode = false

[messages]
timestamp_format = "%H:%M:%S"
show_system_messages = true
compact_display = false
sound_notifications = false
notification_sound = "default"
max_message_size = 4096
history_retention_days = 7

[channels]
default_channel = "mesh #bluetooth"
auto_join_default = true
show_channel_list = true
max_channel_name_length = 32

[performance]
max_cpu_usage_percent = 30
max_memory_mb = 200
message_queue_size = 500
max_concurrent_connections = 10
gui_update_interval_ms = 100

[security]
require_encryption = true
verify_peer_identity = true
auto_trust_known_peers = false
key_rotation_interval_hours = 24

[storage]
data_dir = "~/.local/share/blue-relay-chat"
database_file = "laptop_client.db"
config_backup = true

[network]
mesh_ttl = 7
retry_attempts = 3
retry_delay_seconds = 5
keepalive_interval_seconds = 60
compression_threshold = 100

[platform]
# Platform-specific settings will be added here
# These override the general settings above if needed